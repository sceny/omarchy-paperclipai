name: release

# A release, the steps after the release pull request:
# - a pull request into main is checked first (job check, read-only): the
#   version in manifest.json needs its CHANGELOG section
#   (`## X.Y.Z — YYYY-MM-DD`) and no tag yet;
# - when main gets a version with no tag (job publish, the only job that
#   writes), the pushed commit is tagged vX.Y.Z, the release is published
#   with that CHANGELOG section as its notes, and develop is brought level
#   with main;
# - develop takes changes only through its merge queue, and the GitHub Actions
#   app cannot bypass that, so the push to develop goes with the deploy key in
#   secret DEVELOP_SYNC_KEY, the ruleset's only bypass actor. The secret lives
#   in environment `release`, which only main can deploy from: a job on any
#   other branch cannot read the key;
# - a release that reaches main as a single-parent commit (a squash or a
#   rebase) fails the publish job once it is tagged: the release pull request
#   is merged with a merge commit. GitHub offers no per-pull-request check of
#   the merge method, so it is caught here, after the merge.
# `dev/release-prepare X.Y.Z` makes a branch that passes the first check.
# Two jobs because GitHub takes no expression under `permissions`: a file
# with one fails every run in 0 s.
# A push to main whose version is already tagged does nothing. The
# marketplace review is still requested by hand.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit of the release tag, not to a tag that can move.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: A release into main is ready
        run: |
          eval "$(dev/release-notes "$RUNNER_TEMP/notes.md" | sed 's/^/export /')"
          if [ "$tagged" = true ]; then
            echo "::error file=manifest.json::v$version is already released: set the new version in manifest.json"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::No '## $version — YYYY-MM-DD' section with entries"
            exit 1
          fi
          echo "::notice::Merge this pull request with a merge commit, never squash: the release run fails on a single-parent commit on main"
          echo "Release notes for v$version:"
          cat "$RUNNER_TEMP/notes.md"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Version and its notes
        id: version
        run: dev/release-notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Tag and publish
        if: steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::No '## $version — YYYY-MM-DD' section with entries; nothing tagged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Paperclip $version" "$GITHUB_SHA"
          git push origin "v$version"
          gh release create "v$version" --title "Paperclip $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest

      - name: Bring develop level with main
        if: steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOP_SYNC_KEY: ${{ secrets.DEVELOP_SYNC_KEY }}
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop "$GITHUB_SHA"; then
            # develop requires a public-text status on every commit it takes;
            # this commit is a push to main with no pull request text to read
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=public-text \
              -f description="A push to main: no pull request text to check"
            if [ -z "$DEVELOP_SYNC_KEY" ]; then
              echo "::error::No DEVELOP_SYNC_KEY in environment release: develop is not brought level with main"
              exit 1
            fi
            ssh_dir="$RUNNER_TEMP/develop-sync"
            mkdir -m 700 "$ssh_dir"
            printf '%s\n' "$DEVELOP_SYNC_KEY" > "$ssh_dir/key"
            chmod 600 "$ssh_dir/key"
            # github.com's host keys as GitHub publishes them over HTTPS
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
            GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA:refs/heads/develop"
            rm -rf "$ssh_dir"
          else
            echo "::warning::develop has commits main does not; merge main into develop by hand"
          fi

      - name: The release arrived as a merge commit
        if: steps.version.outputs.tagged == 'false' && !cancelled()
        run: |
          parents=$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "::error::$GITHUB_SHA has one parent: the release pull request was squashed or rebased. It is tagged and published as it stands; merge with a merge commit next time so main and develop keep one history"
            exit 1
          fi
