name: develop-notice

# GitHub's failed-run notice goes only to the pusher's notification settings, so a red
# public-text check on a push to develop opens an issue assigned to the pusher. Its own
# workflow, on the push alone, keeps the public-text workflow read-only. The check's
# output goes in a fenced block, which public-text does not read: the notice is an
# issue, and its rule names (`[rig]`, `[sandbox]`) would otherwise fail it.

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Public text against the rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 dev/public-text-check --time-limit 240 2>&1 | tee "$RUNNER_TEMP/public-text.txt"
      - name: Tell a person that a push to develop broke the rules
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/public-text-notice.md"
          if grep -q '^public-text-check: out of time:' "$RUNNER_TEMP/public-text.txt"; then
            title="public-text ran out of time on develop"
            lead="The \`public-text\` check ran out of time on a push to \`develop\`, so the text was not checked."
            ending="Run the job again from the run above."
          else
            title="public-text failed on develop"
            lead="The \`public-text\` check failed on a push to \`develop\`."
            ending="Edit the text that failed, or record here why it stays."
          fi
          {
            echo "$lead The commit is ${COMMIT_URL} and the run is ${RUN_URL}."
            echo
            echo "Check output:"
            echo
            echo "~~~"
            cat "$RUNNER_TEMP/public-text.txt"
            echo "~~~"
            echo
            echo "$ending"
          } > "$body"
          assignee="$ACTOR"
          # A merge queue is a bot, which no issue can be assigned to: assign the merged pull request's author.
          if [[ "$ACTOR" == *'[bot]' ]]; then
            assignee="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.user.type == "User")][0].user.login // ""')" || assignee=""
          fi
          assign=()
          if [ -n "$assignee" ]; then
            assign=(--assignee "$assignee")
          else
            echo "::warning::No person to assign the notice to; it is filed without an assignee"
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" "${assign[@]}"
