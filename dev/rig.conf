# Per-plugin configuration for the Omarchy plugin test rig.
#
# This is the ONLY file a second plugin repo has to change. Copy the whole
# dev/ directory into the other repo and edit the values below.
#
# shellcheck shell=bash

# The plugin id in manifest.json. The rig installs, enables, disables and
# removes exactly this id and refuses to touch anything else.
RIG_PLUGIN_ID="sceny.paperclipai"

# Where the plugin source lives, relative to this file's directory (dev/).
# ".." means "the repo this dev/ directory sits in".
RIG_PLUGIN_SRC=".."

# Bar section the rig enables the widget into: left, center or right.
RIG_BAR_SECTION="right"

# Fallback for a source that is not a git checkout: files and directories
# copied into the throwaway git repo the rig installs from. In a git checkout
# the rig packages the tracked tree instead. Keep this to what a real
# release ships — the point is package parity, so dev/ and local junk stay out.
RIG_PACKAGE_PATHS=(
  manifest.json
  Panel.qml
  Service.qml
  PaperclipMark.qml
  Model.js
  bin
  lib
  assets
  skills
)

# Does this plugin need a throwaway Paperclip instance? 1 for the Paperclip
# plugin, 0 for plugins that do not talk to Paperclip (e.g. sceny.devices).
RIG_NEEDS_PAPERCLIP=1

# Plugin commands the smoke checks exercise while the instance is UP, as
# "<script> <args...>" lines. Each runs inside the rig sandbox and is expected
# to exit 0; its output and exit code are recorded as evidence.
#
# Pick the non-interactive, nothing-spawning form of each script. The rig env
# makes it impossible to reach the host, but a command that opens a terminal or
# an AI session still has no business in an automated check.
RIG_SMOKE_COMMANDS=(
  "bin/omarchy-paperclip-status --compact"
  "bin/omarchy-paperclip-status --compact --inbox-filter all"
  "bin/omarchy-paperclip-service status"
  "bin/omarchy-paperclip-doctor --bundle-only"
  "bin/omarchy-paperclip-webapp ensure"
  "bin/omarchy-paperclip-open --new-window"
  "bin/omarchy-paperclip-agent --list-skills"
  # Storage for the snooze: reading it never writes, and a missing file is a state.
  "bin/omarchy-paperclip-snooze get"
  # The writer, in the two forms that change nothing: a bad argument set, and
  # a count with no --apply. Anything that would actually write stays out.
  "bin/omarchy-paperclip-inbox retry --company rig --kind run"
  "bin/omarchy-paperclip-inbox clear-failed --company rig --older-than-days 7"
)

# The same, for the instance-is-DOWN path. These must still exit 0: reporting
# "down" is the job. Anything that exits non-zero here is a plugin bug.
RIG_SMOKE_COMMANDS_DOWN=(
  "bin/omarchy-paperclip-status --compact"
  "bin/omarchy-paperclip-service status"
  "bin/omarchy-paperclip-doctor --bundle-only"
  "bin/omarchy-paperclip-snooze get"
  # An instance that is not answering is a sentence, not a crash.
  "bin/omarchy-paperclip-inbox clear-failed --company rig --older-than-days 7"
)

# Nested output geometry. Large enough that the bar renders the way it does on
# a real monitor; small enough to stay out of the way as a nested window.
RIG_OUTPUT_WIDTH=1600
RIG_OUTPUT_HEIGHT=900
